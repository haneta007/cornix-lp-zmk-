# Diagnostic workaround for ZMK split GATT discovery issue #3156.
# Disabling battery fetching avoids starting a nested CCC discovery while
# the split characteristics are still being enumerated.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
