# Raw cursor comparison with aggregate USB CDC timing logs.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
CONFIG_ZMK_NAPE_CURSOR_INERTIA=n
CONFIG_ZMK_NAPE_CURSOR_ACCELERATION=n
CONFIG_ZMK_NAPE_TIMING_DIAGNOSTICS=y
# This diagnostic CDC endpoint carries logs instead of Studio RPC.
CONFIG_ZMK_STUDIO=n
CONFIG_LOG_BUFFER_SIZE=1024

# Suppress unrelated per-input ZMK debug spam; Nape INFO logs stay enabled.
CONFIG_ZMK_LOG_LEVEL=2

CONFIG_ZMK_NAPE_ZERO_LATENCY=y
