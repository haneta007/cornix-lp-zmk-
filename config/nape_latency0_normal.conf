# Keep the normal Nape bridge display at a fixed brightness.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Normal cursor features with the Nape-only latency-zero policy.
CONFIG_ZMK_NAPE_ZERO_LATENCY=y
CONFIG_ZMK_NAPE_CURSOR_INERTIA=y
CONFIG_ZMK_NAPE_CURSOR_ACCELERATION=y
CONFIG_ZMK_STUDIO=y
