# Split central already reserves seven total links. The bridge adds one HID link.
CONFIG_ZMK_NAPE_BRIDGE=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
# The dongle's seven bond slots are full on the live unit. Reserve one more
# for the Nape without changing the existing Prospector firmware variant.
CONFIG_BT_MAX_PAIRED=8
