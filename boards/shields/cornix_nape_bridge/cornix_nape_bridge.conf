# Reserve two Cornix split links, one Nape HID link, and one spare.
CONFIG_ZMK_NAPE_BRIDGE=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
# Two Cornix splits, Nape, and one spare BLE connection slot.
CONFIG_BT_MAX_CONN=4
# Keep enough stored-key slots for the existing peers and Nape.
CONFIG_BT_MAX_PAIRED=8
