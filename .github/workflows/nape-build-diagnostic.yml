name: Nape build diagnostic
on:
  push:
    branches:
      - feat/nape-scroll-inertia
    paths:
      - .github/workflows/nape-build-diagnostic.yml

jobs:
  build-nape:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the same isolated config used by the firmware workflow
        shell: bash
        run: |
          base_dir="${TMPDIR:-/tmp}/zmk-config"
          mkdir -p "${base_dir}/config"
          cp -R config/* "${base_dir}/config/"
          echo "BASE_DIR=${base_dir}" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$(mktemp -d)" >> "$GITHUB_ENV"
      - name: Initialize pinned west workspace
        shell: bash
        working-directory: ${{ env.BASE_DIR }}
        run: |
          west init -l "${BASE_DIR}/config"
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
          west list -f '{name} {revision}'
      - name: Build one normal Nape Prospector variant and expose diagnostics
        shell: bash
        working-directory: ${{ env.BASE_DIR }}
        run: |
          set +e
          west build -s zmk/app -d "${BUILD_DIR}" -b 'xiao_ble//zmk' \
            -S 'studio-rpc-usb-uart nrf52840-nosd' -- \
            -DZMK_CONFIG="${BASE_DIR}/config" \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
            -DSHIELD='cornix_dongle_adapter prospector_adapter cornix_nape_bridge' \
            -DKEYMAP_FILE="${GITHUB_WORKSPACE}/config/cornix.keymap" \
            -DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/nape_fixed_brightness.conf" \
            >"${GITHUB_WORKSPACE}/nape-west-build.log" 2>&1
          build_rc=$?
          if [ "$build_rc" -ne 0 ]; then
            echo "## Nape build diagnostics" >> "$GITHUB_STEP_SUMMARY"
            echo "Build exit code: ${build_rc}" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "${BUILD_DIR}/zephyr/.config" ]; then
              grep -E 'CONFIG_ZMK_BOARD_COMPAT|CONFIG_ZMK=|CONFIG_ZMK_NAPE_BRIDGE' \
                "${BUILD_DIR}/zephyr/.config" >> "$GITHUB_STEP_SUMMARY" || true
            else
              echo 'No generated zephyr/.config' >> "$GITHUB_STEP_SUMMARY"
            fi
            diagnostic_lines=$(grep -nEi 'error:|error:|CMake Error|FAILED:|fatal error|undefined reference|No rule to make target|not found' \
              "${GITHUB_WORKSPACE}/nape-west-build.log" | tail -n 40)
            if [ -z "$diagnostic_lines" ]; then
              diagnostic_lines=$(tail -n 40 "${GITHUB_WORKSPACE}/nape-west-build.log")
            fi
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error title=Nape build diagnostic::${line}"
            done <<< "$diagnostic_lines"
            exit "$build_rc"
          fi
          tail -n 30 "${GITHUB_WORKSPACE}/nape-west-build.log"
      - name: Remove temporary build log
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/nape-west-build.log"
