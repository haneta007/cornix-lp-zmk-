name: Nape HID parser
on:
  push:
    paths:
      - "nape_bridge/hid_mouse.*"
      - "nape_bridge/input_queue.h"
      - "nape_bridge/tests/**"
      - "boards/shields/cornix_nape_bridge/cornix_nape_bridge.overlay"
      - "boards/shields/cornix_nape_bridge/nape_layer_index.h"
      - "config/cornix.keymap"
      - "build.yaml"
      - ".github/workflows/nape-parser.yml"
  pull_request:
    paths:
      - "nape_bridge/hid_mouse.*"
      - "nape_bridge/input_queue.h"
      - "nape_bridge/tests/**"
      - "boards/shields/cornix_nape_bridge/cornix_nape_bridge.overlay"
      - "boards/shields/cornix_nape_bridge/nape_layer_index.h"
      - "config/cornix.keymap"
      - "build.yaml"
      - ".github/workflows/nape-parser.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run parser tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g nape_bridge/hid_mouse.c nape_bridge/tests/hid_mouse_test.c -o /tmp/nape-hid-test
          /tmp/nape-hid-test
      - name: Validate temporary layer index
        run: python3 nape_bridge/tests/validate_layer_index.py
