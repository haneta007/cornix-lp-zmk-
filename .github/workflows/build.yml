name: Build ZMK firmware
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional successful build run ID to package without rebuilding
        required: false
        default: ""
        type: string
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/build.yml"
      - "boards/**"
      - "config/**"
      - "config-baseline/**"
      - "build-baseline.yaml"
      - "build.yaml"
      - "scripts/package_daily_firmware.py"
      - "nape_bridge/**"
      - "Kconfig"
      - "CMakeLists.txt"
      - "zephyr/module.yml"
      - "dts/**"

jobs:
  validate-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep rollback keymap pinned to dev baseline
        run: echo "5cbe5c660bb6e60194c6c0a275a1621519d490c41c01e02963bfd3277391ef7a  config-baseline/cornix.keymap" | sha256sum --check

  build:
    if: ${{ !inputs.source_run_id }}
    needs: validate-baseline
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@9ebbeff0a8b69a42f14aec022cdf16c7a107b9e0
    with:
      build_matrix_path: build.yaml
      config_path: config

  build-baseline:
    # The reusable workflow merge job consumes the shared artifact-* pattern.
    # Run it after the main matrix has merged its artifacts to avoid a race.
    if: ${{ !inputs.source_run_id }}
    needs: [validate-baseline, build]
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@9ebbeff0a8b69a42f14aec022cdf16c7a107b9e0
    with:
      build_matrix_path: build-baseline.yaml
      config_path: config-baseline
      archive_name: firmware-baseline-dev

  package-daily:
    # An explicit previous run packages known-good bytes without compiling.
    if: ${{ always() && needs.validate-baseline.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.source_run_id != '')) }}
    needs: [validate-baseline, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate previous source build
        if: ${{ inputs.source_run_id }}
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path("source-run.json").read_text())
          assert run["conclusion"] == "success", "Source firmware build must have succeeded"
          assert run["path"] == ".github/workflows/build.yml", "Expected Build ZMK firmware"
          assert run["head_repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={run['head_sha']}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: source-firmware
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - name: Package daily UF2 files
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha || github.sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
        run: python3 scripts/package_daily_firmware.py source-firmware daily-firmware --sha "$SOURCE_SHA" --run-id "$SOURCE_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-daily
          path: daily-firmware/
          if-no-files-found: error

  package-cursor-check:
    if: ${{ !inputs.source_run_id }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: source-firmware
      - name: Select raw cursor comparison firmware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          source = Path("source-firmware")
          output = Path("cursor-check")
          output.mkdir()
          hashes = []
          for name in ("cornix_prospector_nape_raw_cursor_nosd.uf2",
                       "cornix_prospector_nape_raw_cursor_usb_log_nosd.uf2"):
              matches = list(source.rglob(name))
              assert len(matches) == 1, f"Expected exactly one {name}"
              original = matches[0].read_bytes()
              target = output / name
              target.write_bytes(original)
              assert target.read_bytes() == original
              hashes.append(f"{hashlib.sha256(original).hexdigest()}  {name}")
          (output / "SHA256SUMS.txt").write_text("\n".join(hashes) + "\n")
          shutil.copyfile("NAPE_CURSOR_DIAGNOSTICS.md", output / "README.md")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-cursor-check
          path: cursor-check/
          if-no-files-found: error

  package-latency-check:
    if: ${{ !inputs.source_run_id }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: source-firmware
      - name: Select latency comparison firmware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          source = Path("source-firmware")
          output = Path("latency-check")
          output.mkdir()
          hashes = []
          for name in ("cornix_prospector_nape_raw_cursor_usb_log_nosd.uf2",
                       "cornix_prospector_nape_raw_cursor_latency0_nosd.uf2",
                       "cornix_prospector_nape_raw_cursor_latency0_usb_log_nosd.uf2"):
              matches = list(source.rglob(name))
              assert len(matches) == 1, f"Expected exactly one {name}"
              payload = matches[0].read_bytes()
              target = output / name
              target.write_bytes(payload)
              assert target.read_bytes() == payload
              hashes.append(f"{hashlib.sha256(payload).hexdigest()}  {name}")
          (output / "SHA256SUMS.txt").write_text("\n".join(hashes) + "\n")
          shutil.copyfile("NAPE_LATENCY_COMPARISON.md", output / "README.md")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-latency-check
          path: latency-check/
          if-no-files-found: error
