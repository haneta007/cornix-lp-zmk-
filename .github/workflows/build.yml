name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "boards/**"
      - "config/**"
      - "config-baseline/**"
      - "build-baseline.yaml"
      - "build.yaml"
      - "nape_bridge/**"
      - "Kconfig"
      - "CMakeLists.txt"
      - "zephyr/module.yml"
      - "dts/**"
    tags-ignore:
      - "*"

jobs:
  validate-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep rollback keymap pinned to dev baseline
        run: echo "5cbe5c660bb6e60194c6c0a275a1621519d490c41c01e02963bfd3277391ef7a  config-baseline/cornix.keymap" | sha256sum --check

  build:
    needs: validate-baseline
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@9ebbeff0a8b69a42f14aec022cdf16c7a107b9e0
    with:
      build_matrix_path: build.yaml
      config_path: config

  build-baseline:
    # The reusable workflow merge job consumes the shared artifact-* pattern.
    # Run it after the main matrix has merged its artifacts to avoid a race.
    needs: [validate-baseline, build]
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@9ebbeff0a8b69a42f14aec022cdf16c7a107b9e0
    with:
      build_matrix_path: build-baseline.yaml
      config_path: config-baseline
      archive_name: firmware-baseline-dev
